<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ícone da app Movimentos: folha de lançamentos + entradas/saídas -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f6f8b"/>
      <stop offset="1" stop-color="#0d2b45"/>
    </linearGradient>
    <linearGradient id="brilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cabecalho" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a9d8f"/>
      <stop offset="1" stop-color="#3fb8a9"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <filter id="sombraIcone" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <clipPath id="folhaClip"><rect x="232" y="214" width="470" height="590" rx="40"/></clipPath>
  </defs>

  <!-- base (quadrado arredondado ao estilo macOS) -->
  <g filter="url(#sombraIcone)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#fundo)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#brilho)"/>
  </g>

  <!-- folha de movimentos -->
  <g filter="url(#sombra)">
    <rect x="232" y="214" width="470" height="590" rx="40" fill="#f8fafc"/>
  </g>
  <g clip-path="url(#folhaClip)">
    <rect x="232" y="214" width="470" height="104" fill="url(#cabecalho)"/>
    <rect x="282" y="252" width="190" height="28" rx="14" fill="#ffffff" opacity=".9"/>
    <rect x="552" y="252" width="100" height="28" rx="14" fill="#ffffff" opacity=".55"/>
  </g>
  <!-- linhas: marcador, descrição, valor -->
  <g>
    <circle cx="298" cy="378" r="18" fill="#2eb872"/>
    <rect x="336" y="366" width="170" height="24" rx="12" fill="#cbd5e1"/>
    <rect x="566" y="366" width="86" height="24" rx="12" fill="#2eb872"/>

    <circle cx="298" cy="458" r="18" fill="#ef6461"/>
    <rect x="336" y="446" width="200" height="24" rx="12" fill="#cbd5e1"/>
    <rect x="586" y="446" width="66" height="24" rx="12" fill="#ef6461"/>

    <circle cx="298" cy="538" r="18" fill="#2eb872"/>
    <rect x="336" y="526" width="140" height="24" rx="12" fill="#cbd5e1"/>
    <rect x="556" y="526" width="96" height="24" rx="12" fill="#2eb872"/>

    <circle cx="298" cy="618" r="18" fill="#ef6461"/>
    <rect x="336" y="606" width="120" height="24" rx="12" fill="#cbd5e1"/>

    <circle cx="298" cy="698" r="18" fill="#cbd5e1"/>
    <rect x="336" y="686" width="100" height="24" rx="12" fill="#e2e8f0"/>
  </g>

  <!-- selo com entradas / saídas -->
  <g filter="url(#sombra)">
    <circle cx="690" cy="690" r="158" fill="#0d2b45"/>
  </g>
  <circle cx="690" cy="690" r="158" fill="none" stroke="#f8fafc" stroke-width="18"/>
  <!-- seta para cima (entrada) -->
  <g fill="none" stroke="#3ddc84" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M636 776 V606"/>
    <path d="M588 654 L636 606 L684 654"/>
  </g>
  <!-- seta para baixo (saída) -->
  <g fill="none" stroke="#ff7a70" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M744 604 V774"/>
    <path d="M696 726 L744 774 L792 726"/>
  </g>
</svg>
