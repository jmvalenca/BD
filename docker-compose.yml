services:
  db:
    build: ./docker
    restart: unless-stopped
    environment:
      # A password vem do ficheiro .env (não versionado) — ver .env.example
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    build: ./docker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      # o pg_dump precisa da password do postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
      TZ: Europe/Lisbon   # backups à 01:00 hora de Lisboa
    volumes:
      # pasta backups/ do projeto no Mac (fora do Docker: visível no Finder,
      # incluída no Time Machine e não apagada por "docker compose down -v")
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Relatórios periódicos (CSV por e-mail via Gmail) — ver relatorios.py
  relatorios:
    build: .
    restart: unless-stopped
    command: ["python", "relatorios.py"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      HORA_ENVIO: ${HORA_ENVIO:-7}
      TZ: Europe/Lisbon
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      # para o botão "Enviar agora" dos relatórios
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      TZ: Europe/Lisbon
    ports:
      - "2718:2718"   # aplicação em http://localhost:2718
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
