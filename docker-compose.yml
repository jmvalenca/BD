services:
  db:
    build: ./docker
    restart: unless-stopped
    environment:
      # A password vem do ficheiro .env (não versionado) — ver .env.example
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backup:
    build: ./docker
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/backup.sh"]
    environment:
      # o pg_dump precisa da password do postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no ficheiro .env}
    volumes:
      - backups:/backups
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
    ports:
      - "2718:2718"   # aplicação em http://localhost:2718
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  backups:
